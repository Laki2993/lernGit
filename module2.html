<script>
document.getElementById("Logo_widget").addEventListener("click", function() {
   if(document.getElementById("widget").style.width === "50px") {
       document.getElementById("widget").style.width = "1000px";
       document.getElementById("widget").style.height = "500px";
       document.getElementById("widget").style.padding = "10px";
       //document.getElementById("Logo_widget").style.display = "none";
       document.getElementById("widget").style.borderRadius = "5px";
       document.getElementById("insideContent").style.display = "grid";
   } else {
        document.getElementById("widget").style.width = "50px";
        document.getElementById("widget").style.height = "50px";
        document.getElementById("widget").style.padding = "0px";
        document.getElementById("Logo_widget").style.display = "block";
        document.getElementById("widget").style.borderRadius = "70px";
        document.getElementById("insideContent").style.display = "none";
        closeCorrect();
        closeSettingWin();
   }
});

function closeSettingWin(){
    setTimeout(function(){
    if(document.getElementById("SettingWindows").style.display = "grid"){
        document.getElementById("SettingWindows").style.display = "none";
        document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        eventElement.style.border = "none";
    });
    }
    },100);
};

document.getElementById("AddEvent").addEventListener("click", function() {
    closeSettingWin(); 
    let Inp = document.createElement("input");
    Inp.className = "EventInput";
    document.getElementById("Events").appendChild(Inp);
    Inp.focus(); 
});


document.addEventListener("blur", function(event) {
    if (event.target.classList.contains("EventInput") && event.target.value.trim() === "") {
        event.target.remove();
    }
    else if(event.target.classList.contains("EventInput") && event.target.value.trim() !== ""){
        let activeInput = document.querySelector('.EventInput');
        if (activeInput) {
            let Event_P = document.createElement("div");
            Event_P.className = "Event_P";
            Event_P.innerHTML = activeInput.value;
            activeInput.value = "";
            activeInput.remove();
            
            setTimeout(function() {
                document.getElementById("Events").appendChild(Event_P);
            }, 50);
        }
    }
}, true);

    closeSettingWin();

document.getElementById("delete").addEventListener("click", function(event) {
    document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        if (eventElement.style.border === "1px solid gray") {
            eventElement.remove();
            closeSettingWin(); 
        }
    });
});

function serch(){
    let search = null;
    document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        if (eventElement.style.border === "1px solid gray") {
            search = eventElement;
        }
    });
    return search;
}

document.getElementById("correct").addEventListener("click", function(event) {
   document.getElementById("correctConteiner").style.display = "flex";
   serch();    
   if(serch != null){
       const serch_res = serch();  
        document.getElementById("textCorrect").value = serch_res.textContent;
        document.getElementById("correct").classList.add("Correct-Active");
    }
});

function closeCorrect(){
    document.getElementById("correct").classList.remove("Correct-Active"); 
    document.getElementById("textCorrect").value = "";
    document.getElementById("correctConteiner").style.display = "none";
};

document.getElementById("Save").addEventListener("click", function(event) {
    document.getElementById("correctConteiner").style.display = "flex";
       document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        if (eventElement.style.border === "1px solid gray") {
            eventElement.innerHTML = document.getElementById("textCorrect").value;
            closeCorrect();
            closeSettingWin();
        }
    });
});

document.getElementById("close").addEventListener("click", function(event) {
    closeCorrect();
    closeSettingWin();
});

    document.querySelectorAll(".Event_P").forEach(function(eventElement) {
    if (event.target === eventElement) {
        if(eventElement.style.height !== "fit-content")
        eventElement.style.height = "fit-content";
        else{
            eventElement.style.height = "30px";
        }
    }
    });
});
